<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Body</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: min(92vw, 640px);
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .method {
            color: #60a5fa;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1><span class="method">POST</span> Body senden</h1>

        <form method="POST" action="/post_body">
            <label for="body">Request Body</label>
            <textarea id="body" name="body" required></textarea>

            <button type="submit">POST</button>
        </form>

        <a href="/index.html">← Zurück</a>
    </main>
</body>
</html>
