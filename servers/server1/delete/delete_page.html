<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELETE File/Directory</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: min(92vw, 640px);
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
        }

        h1 {
            text-align: center;
        }

        .method {
            color: #dc2626;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
        }

        button {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1><span class="method">DELETE</span> Datei oder Verzeichnis löschen</h1>

        <form id="deleteForm">
            <label for="deletepath">Path to delete</label>
            <input type="text" id="deletepath" required?>

            <button type="button" onclick="handleDelete()">DELETE</button>
        </form>

        <script>
            function handleDelete() {
                const path = document.getElementById('deletepath').value.trim();
                if (!path) {
                    alert('Pfad erforderlich');
                    return;
                }
                // Entferne führenden Slash
                let cleanPath = path;
                if (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);
                const encoded = encodeURI(cleanPath);

                fetch(`/${encoded}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type' : 'application/x-www-form-urlencoded',
                    },
                })
                .then(response => response.text())
                .then(text => { alert('Response: ' + text); })
                .catch(err => { alert('Error: ' + err)});
            }
        </script>

        <a href="index.html">← Zurück</a>
    </main>
</body>
</html>
