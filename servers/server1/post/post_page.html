<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST Body</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: min(92vw, 640px);
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .method {
            color: #60a5fa;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            resize: vertical;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            appearance: none;
            cursor: pointer;
        }

        button {
            margin-top: 15px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1><span class="method">POST</span> a File</h1>

        <form id="postForm" method="POST" action="/">

            <label for="filepath">File path</label>
            <input type="text" id="filepath" required placeholder="/uploads/">

            <label for="filetype">File type</label>
            <select id="filetype" required>
                <option value="text/html">text/html</option>
                <option value="text/css">text/css</option>
                <option value="text/plain">text/plain</option>
                <option value="application/javascript">application/javascript</option>
                <option value="application/json">application/json</option>
                <option value="application/xml">application/xml</option>
                <option value="image/png">image/png</option>
                <option value="image/jpeg">image/jpeg</option>
            </select>

            <label for="body">Request body</label>
            <textarea id="body" name="body" required></textarea>

            <button type="submit">POST</button>
        </form>

        <pre id="responseHeaders" style="white-space: pre-wrap;"></pre>

        <script>
            document.getElementById('postForm').addEventListener('submit', function(e) {
                e.preventDefault();
                let path = document.getElementById('filepath').value.trim();
                if (!path) {
                    alert('Pfad erforderlich');
                    return;
                }
                if (path.startsWith('/')) path = path.substring(1);
                const encoded = encodeURI(path);
                const bodyContent = document.getElementById('body').value;
                const fileType = document.getElementById('filetype').value;
                const headers = {
                    'Content-Type': fileType,
                    'Content-Length': bodyContent.length.toString()
                };
                fetch(`/${encoded}`, {
                    method: 'POST',
                    headers: headers,
                    body: bodyContent
                })
                .then(r => {
                    const headerLines = [...r.headers.entries()]
                                            .map(([k, v]) => `${k}: ${v}`)
                                            .join('\n');
                    const out = document.getElementById('responseHeaders');
                    out.textContent = `Status: ${r.status}\n${headerLines}\n\n${bodyContent}`;

                })
                .catch(err => {alert('Fehler: ' + err); });
            });
        </script>

        <a href="/index.html">← Back</a>
    </main>
</body>
</html>
