<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{STATUS_CODE}} {{REASON_PHRASE}}</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
				background: #0f172a;
				color: #e2e8f0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.card {
				width: min(720px, 90vw);
				background: #111827;
				border: 1px solid #1f2937;
				border-radius: 14px;
				padding: 32px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
			}
			h1 {
				margin: 0 0 12px;
				font-size: 28px;
			}
			p {
				margin: 0;
				line-height: 1.5;
				color: #cbd5f5;
			}
			.code {
				font-weight: 700;
				color: #93c5fd;
			}
			.hint {
				margin-top: 16px;
				font-size: 14px;
				color: #94a3b8;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<h1><span class="code">{{STATUS_CODE}}</span> {{REASON_PHRASE}}</h1>
			<p>You are being redirected to a new location.</p>
			<p class="hint">If you are not redirected automatically, check the URL and try again.</p>
		</main>
	</body>
</html>
