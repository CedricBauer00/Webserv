<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserver 1</title>

    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            place-items: center;
            background: #0f172a;
            color: #e2e8f0;
        }

        .card {
            width: min(92vw, 640px);
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.1;
        }

        .subtitle {
            margin: 0 0 32px;
            color: #94a3b8;
            font-size: 1rem;
        }

        .server-name {
            color: #60a5fa;
            font-weight: 700;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .get {
            background: #16a34a;
        }

        .post {
            background: #2563eb;
        }

        .delete {
            background: #dc2626;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1><span class="server-name">Webserver 1</span></h1>
        <p class="subtitle">Choose Method</p>

        <div class="button-container">
            <button class="get"
                onclick="window.location.href='get_page.html'">
                GET
            </button>

            <button class="post"
                onclick="window.location.href='post_page.html'">
                POST
            </button>

            <button class="delete"
                onclick="window.location.href='delete_page.html'">
                DELETE
            </button>
        </div>
    </main>
</body>
</html>
